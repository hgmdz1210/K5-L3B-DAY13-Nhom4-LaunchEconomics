# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02). Tính bằng src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75)); dễ đủ mẫu nhưng cùng một nhân viên vừa dùng vừa không dùng nên tác động tràn
#   b) Theo nhân viên, m = 75: DE = 1 + 74 x 0,02 = 2,48; n = 1.251 x 2,48 = 3.103 yêu cầu mỗi nhóm, tức 42 người mỗi nhóm, tổng 84 lớn hơn 40 nhân viên: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000, nhỏ hơn 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300; chỉ 6 cụm mỗi nhóm, dưới 20: loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) x 0,02) >= 859 ra m >= 299 yêu cầu mỗi nhân viên, DE = 6,96
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20; mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng 6 depot với nhóm trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước (seed 13), phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Không cách chia nào đủ mẫu để thấy mức chênh 5 điểm với 40 nhân viên (c: tối đa 1.000 < 1.251). Nhóm chọn mức chênh 6 điểm
#   (859 mỗi nhóm, m >= 299 yêu cầu mỗi nhân viên). Nếu tác động thật chỉ là 5 điểm thì power chỉ còn khoảng 0,64 (statsmodels NormalIndPower, n = 859).
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.#   Khối lượng: khoảng 921 yêu cầu trong phạm vi mỗi nhân viên mỗi tháng (45.000 x 982 / 1.200 / 40), nên bước 0.50 cần chạy ít nhất 2 tuần
#   để mỗi nhân viên đủ 299 yêu cầu, cộng 7 ngày theo dõi mở lại.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97%. Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu,
#   nên luật an toàn so với nhóm đối chứng (chênh +2 điểm) kèm trần tuyệt đối 6%.
#   Tỉ lệ làm lại trong phạm vi hiện tại 4,9%; tỉ lệ bỏ qua gợi ý (sua + bo) hiện tại 27,12% (48/177).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x) ra khỏi pilot"
  assignment:
    unit: "staff"                 # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 -> 10 -> 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (không đủ mẫu cho 0.05)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng 6 depot, bốc thăm bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6% TRONG 1 tuần THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và PM trợ lý hoàn phí rà 20 trace mở lại trong 3 ngày KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU có từ 1 ca hoàn tiền trùng trở lên TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent sửa khoá chống trùng KHÔNG THÌ không được bật lại trợ lý"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy trong 5 ngày KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm (6 phút, 12.000 đ mỗi yêu cầu)"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút, 1.780.000 đ) và phut_lam_lai_simulated (1.132 phút, 2.264.000 đ)"
    - "Chi phí mỗi việc thành công 4.472 đ, 3.414 đ trong phạm vi, 4.599 đ khi cộng chi phí cố định (simulated)"
    - "Ngưỡng 8.000 đ mỗi việc thành công trong luật dừng chi phí (dựa trên số simulated)"
    - "Giả định bảng giá token 26 đ và 130 đ cho 1.000 token, tool 15 đ, lương 2.000 đ mỗi phút, chi phí cố định 40 triệu đ mỗi tháng"
